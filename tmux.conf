set -s escape-time 0
# some binds
unbind C-b
set -g prefix C-a                   # Use C-a as prefix
bind a send-prefix
bind J     previous-window
bind K     next-window
bind Left  resize-pane -L 5
bind Right resize-pane -R 5
bind Up    resize-pane -U 5
bind Down  resize-pane -D 5
bind n     command-prompt 'rename-window %%'
bind N     command-prompt 'rename-session %%'

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# True color and undercurl inside tmux, including from Ghostty (xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'

# Use fish wherever it's installed (/opt/homebrew/bin on macOS, /usr/bin on Linux)
if-shell 'command -v fish' 'run-shell "tmux set -g default-shell \"\$(command -v fish)\""'

set-option -g focus-events on
set -g base-index 1

# warning sound
set -g bell-action any

# I dont want to be asked when killing a window/pane
# like seriously I went through the effort of pressing C-a x
bind-key x kill-pane
bind-key & kill-window

# Use vim keybindings in copy mode
setw -g mode-keys vi
set -g status-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
# Copy to the system clipboard (pbcopy on macOS, xclip on Linux)
if-shell 'uname | grep -q Darwin' \
  'set -s copy-command "pbcopy"' \
  'set -s copy-command "xclip -i -sel p -f | xclip -i -sel c"'
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel \; display-message "Copied to system clipboard."
bind-key -T copy-mode-vi 'Y' send -X copy-pipe \; display-message "Copied to system clipboard."

set -g mouse on

# smart pane switching with awareness of vim splits
# Copy paste from Nvim Tmux navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Clear screen with C-a C-l
bind C-l send-keys 'C-l'

# rebind pane tiling
bind V split-window -h
bind H split-window
bind / split-window -h
bind - split-window

# screen like window toggling
bind C-a last-window
bind Tab last-window
bind Escape copy-mode

# Keep plenty of history for scrollback
set -g history-limit 10000

set-option -g status-position bottom
bind-key -n S-Up set-option -g status
bind-key -n S-Down set-option -g status

# source tmuxline
if-shell "test -f ~/dotfiles/tmuxline" "source ~/dotfiles/tmuxline"
if-shell "test -f ~/Projects/dotfiles/tmuxline" "source ~/Projects/dotfiles/tmuxline"
